server:
  shutdown: graceful

spring:
  application:
    name: learning-buddy
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  # Database connection
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/learningbuddy}
    username: ${DATABASE_USER:myuser}
    password: ${DATABASE_PASSWORD:secretpassword}
    hikari:
      maximum-pool-size: ${POOL_SIZE:10}
  # Database migraiton
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${IS_FLYWAY_BASELINE_ON_MIGRATE:true}
    validate-on-migrate: ${IS_FLYWAY_VALIDATE_ON_MIGRATE:true}
    locations:
      - classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:7c9df9c7cb3a3e660853c53a9292d442d4918d9543ea2d7c4cafa30613bbe734}
      expiration: ${JWT_EXPIRATION:86400000} # Default: 1 day (in ms)
      refresh-token:
        expiration: ${JWT_REFRESH_EXPIRATION:604800000} # Default: 7 days
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

quiz:
  async:
    core-pool-size: 5      # Match AI service max concurrency
    max-pool-size: 10      # Scale up under load
    queue-capacity: 100