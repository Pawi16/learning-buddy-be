type: object
required:
  - course_id
  - deck_topics
properties:
  course_id:
    type: integer
    description: "ID of the course to generate the deck for"
  deck_topics:
    type: array
    items:
      type: object
      required:
        - topic_id
        - amount
      properties:
        topic_id:
          type: integer
        amount:
          type: integer
          description: "Number of cards to generate for this topic"
          example: 5