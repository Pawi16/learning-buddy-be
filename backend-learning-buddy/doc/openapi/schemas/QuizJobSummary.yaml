# schemas/JobSummary.yaml
type: object
properties:
  job_id:
    type: string
    format: uuid
  course_id:         # <--- NEW
    type: integer
    description: "Needed to save the final quiz"
  course_title:      # <--- NEW
    type: string
    description: "For display purposes in the UI"
  status:
    type: string
    enum: [QUEUED, PROCESSING, COMPLETED, FAILED]
  progress_percent:
    type: integer
  total_topics:
    type: integer
  completed_topics:
    type: integer
  created_at:
    type: string
    format: date-time