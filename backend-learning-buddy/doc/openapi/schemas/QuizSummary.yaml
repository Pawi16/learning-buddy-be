type: object
description: "Lightweight object for listing quizzes in a course dashboard."
required:
  - quiz_id
  - title
  - is_published
  - solution_visibility
properties:
  quiz_id:
    type: integer
    description: "Primary Key"
    example: 15
  title:
    type: string
    description: "The name of the quiz"
    example: "Chapter 1: Intro to Java"
  solution_visibility:
    type: string
    enum: [ALWAYS, NEVER]
    description: |
      Determines feedback visibility.
      ALWAYS = Practice Mode (Show answers and explanation at the end)
      NEVER = Exam Mode (Hide answers and explanation)
    example: "ALWAYS"
  is_published:
    type: boolean
    description: "True if visible to students, False if Draft"
    example: true
  question_count:
    type: integer
    description: "Total number of questions in this quiz (Calculated field)"
    example: 10
  created_at:
    type: string
    format: date-time
    description: "When the quiz was created"
    example: "2023-10-27T10:00:00Z"
  updated_at:
    type: string
    format: date-time
    description: "When the quiz was updated"
    example: "2023-10-28T10:00:00Z"