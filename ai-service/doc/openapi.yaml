openapi: 3.1.0
info:
  title: Learning Buddy AI Service
  description: AI-powered PDF processing and topic extraction service
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      summary: Health Check
      description: Health check endpoint.
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/process-pdf:
    post:
      summary: Process Pdf
      description: "Process a PDF file and extract topics with AI-generated summaries.\n\
        \nArgs:\n    file: PDF file to process (max 10MB)\n\nReturns:\n    List of\
        \ processed topics with titles, descriptions, and summaries"
      operationId: process_pdf_api_v1_process_pdf_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_process_pdf_api_v1_process_pdf_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProcessedTopic'
                type: array
                title: Response Process Pdf Api V1 Process Pdf Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_process_pdf_api_v1_process_pdf_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_process_pdf_api_v1_process_pdf_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProcessedTopic:
      properties:
        order_index:
          type: integer
          title: Order Index
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        raw_text:
          type: string
          title: Raw Text
        summary_note:
          type: string
          title: Summary Note
      type: object
      required:
      - order_index
      - title
      - description
      - raw_text
      - summary_note
      title: ProcessedTopic
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
