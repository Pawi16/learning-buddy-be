openapi: 3.1.0
info:
  title: Learning Buddy AI Service
  description: AI-powered PDF processing and topic extraction service
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      summary: Health Check
      description: Health check endpoint.
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Check Api V1 Health Get
  /api/v1/generate-quiz:
    post:
      summary: Generate Quiz
      description: Generate quiz questions from topic content using AI.
      operationId: generate_quiz_api_v1_generate_quiz_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQuizRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/generate-flashcard:
    post:
      summary: Generate Flashcard
      description: Generate flashcards from topic content using AI.
      operationId: generate_flashcard_api_v1_generate_flashcard_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateFlashcardRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/process-pdf:
    post:
      summary: Process Pdf
      description: Process a PDF file and extract topics with AI-generated summaries.
      operationId: process_pdf_api_v1_process_pdf_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_process_pdf_api_v1_process_pdf_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Body_process_pdf_api_v1_process_pdf_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_process_pdf_api_v1_process_pdf_post
    FlashcardConfig:
      properties:
        amount:
          type: integer
          title: Amount
          description: Number of flashcards to generate
      type: object
      required:
      - amount
      title: FlashcardConfig
      description: Configuration for flashcard generation.
    GenerateFlashcardRequest:
      properties:
        topicName:
          type: string
          title: Topicname
          description: Name of the topic
        topicContent:
          type: string
          title: Topiccontent
          description: Content text for the topic
        config:
          $ref: '#/components/schemas/FlashcardConfig'
          description: Flashcard configuration
      type: object
      required:
      - topicName
      - topicContent
      - config
      title: GenerateFlashcardRequest
      description: Request to generate flashcards from topic content.
    GenerateQuizRequest:
      properties:
        topicName:
          type: string
          title: Topicname
        topicContent:
          type: string
          title: Topiccontent
        quiz_config:
          items:
            $ref: '#/components/schemas/QuizConfig'
          type: array
          title: Quiz Config
      type: object
      required:
      - topicName
      - topicContent
      - quiz_config
      title: GenerateQuizRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    QuestionTypeRequest:
      properties:
        type:
          type: string
          enum:
          - NORMAL_MULTIPLE
          - STATEMENT_VERIFICATION
          - STATEMENT_COUNTING
          title: Type
        number:
          type: integer
          title: Number
      type: object
      required:
      - type
      - number
      title: QuestionTypeRequest
    QuizConfig:
      properties:
        difficulty:
          type: string
          enum:
          - EASY
          - MEDIUM
          - HARD
          title: Difficulty
        quiz_type_config:
          items:
            $ref: '#/components/schemas/QuestionTypeRequest'
          type: array
          title: Quiz Type Config
      type: object
      required:
      - difficulty
      - quiz_type_config
      title: QuizConfig
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
