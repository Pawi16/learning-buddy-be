openapi: 3.1.0
info:
  title: Learning Buddy AI Service
  description: AI-powered PDF processing, topic extraction, and quiz generation service
  version: 0.2.0
paths:
  /api/v1/health:
    get:
      summary: Health Check
      description: Health check endpoint.
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/process-pdf:
    post:
      summary: Process Pdf
      description: "Process a PDF file and extract topics with AI-generated summaries.\n\
        \nArgs:\n    file: PDF file to process (max 10MB)\n\nReturns:\n    List of\
        \ processed topics with titles, descriptions, and summaries"
      operationId: process_pdf_api_v1_process_pdf_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_process_pdf_api_v1_process_pdf_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProcessedTopic'
                type: array
                title: Response Process Pdf Api V1 Process Pdf Post
        '400':
          description: Bad Request - Missing filename or empty file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_filename:
                  value:
                    timestamp: "2026-01-25T10:30:00Z"
                    status: 400
                    error: "Bad Request"
                    message: "No filename provided"
                    path: "/api/v1/process-pdf"
                    details: null
                empty_file:
                  value:
                    timestamp: "2026-01-25T10:30:00Z"
                    status: 400
                    error: "Bad Request"
                    message: "Empty file"
                    path: "/api/v1/process-pdf"
                    details: null
        '413':
          description: Payload Too Large - File exceeds maximum size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-01-25T10:30:00Z"
                status: 413
                error: "Payload Too Large"
                message: "File too large. Maximum size: 10.0MB"
                path: "/api/v1/process-pdf"
                details:
                  - "Maximum size: 10.0MB"
        '415':
          description: Unsupported Media Type - File type not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-01-25T10:30:00Z"
                status: 415
                error: "Unsupported Media Type"
                message: "Unsupported file type. Allowed types: .pdf"
                path: "/api/v1/process-pdf"
                details:
                  - ".pdf"
        '422':
          description: Validation Error - Request format or data validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-01-25T10:30:00Z"
                status: 422
                error: "ValidationError"
                message: "Request validation failed"
                path: "/api/v1/process-pdf"
                details:
                  - "body -> file: field required"
                  - "query -> limit: ensure this value is greater than 0"
        '500':
          description: Internal Server Error - PDF processing or AI service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                pdf_parsing_error:
                  value:
                    timestamp: "2026-01-25T10:30:00Z"
                    status: 500
                    error: "Internal Server Error"
                    message: "Failed to scan PDF: unexpected error"
                    path: "/api/v1/process-pdf"
                    details: null
                pdf_corrupted:
                  value:
                    timestamp: "2026-01-25T10:30:00Z"
                    status: 500
                    error: "PDFCorrupted"
                    message: "PDF file is corrupted or has invalid syntax"
                    path: "/api/v1/process-pdf"
                    details:
                      - "Expected end of stream, found garbage"
                ai_strategy_error:
                  value:
                    timestamp: "2026-01-25T10:30:00Z"
                    status: 500
                    error: "AIStrategyError"
                    message: "AI service failed to analyze document structure"
                    path: "/api/v1/process-pdf"
                    details:
                      - "Model: GLM-4.5"
                      - "Body font size: 12.0"
                      - "Font sizes analyzed: 8"
                ai_enrichment_error:
                  value:
                    timestamp: "2026-01-25T10:30:00Z"
                    status: 500
                    error: "AIEnrichmentError"
                    message: "Failed to enrich topic 3 (Introduction to Python)"
                    path: "/api/v1/process-pdf"
                    details:
                      - "Timeout after 30 seconds"
        '503':
          description: Service Unavailable - AI service is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-01-25T10:30:00Z"
                status: 503
                error: "Service Unavailable"
                message: "AI service is currently unavailable after 3 retries"
                path: "/api/v1/process-pdf"
                details:
                  - "Connection refused"
  /api/v1/generate-quiz:
    post:
      summary: Generate Quiz
      description: "Generate quiz questions based on a topic and its content.\n\nArgs:\n    topicName: Name of the topic to generate quiz for\n    topicContent: Content/text about the topic\n    quiz_config: Quiz configuration array with difficulty and question types\n\nReturns:\n    Generated quiz with questions, choices, and explanations"
      operationId: generate_quiz_api_v1_generate_quiz_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQuizRequest'
            examples:
              easy_quiz:
                summary: Easy quiz on Builder Pattern
                value:
                  topicName: "Builder Pattern"
                  topicContent: "The Builder pattern is a creational design pattern that separates the construction of a complex object from its representation, allowing the same construction process to create different representations."
                  quiz_config:
                    - difficulty: "EASY"
                      quiz_type_config:
                        - type: "NORMAL_MULTIPLE"
                          number: 2
              mixed_difficulty:
                summary: Mixed difficulty quiz
                value:
                  topicName: "Design Patterns"
                  topicContent: "Design patterns are best practices that the programmer can use to solve common problems when designing an application or system."
                  quiz_config:
                    - difficulty: "EASY"
                      quiz_type_config:
                        - type: "NORMAL_MULTIPLE"
                          number: 1
                    - difficulty: "MEDIUM"
                      quiz_type_config:
                        - type: "STATEMENT_VERIFICATION"
                          number: 2
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
              examples:
                normal_multiple:
                  summary: Normal multiple choice questions
                  value:
                    topic_title: "Builder Pattern"
                    questions:
                      - question_text: "What is the primary purpose of the Builder pattern?"
                        question_type: "NORMAL_MULTIPLE"
                        explanation: "The Builder pattern separates the construction of an object from its representation."
                        difficulty_level: "EASY"
                        choices:
                          - choice_text: "To improve performance"
                            is_correct: false
                          - choice_text: "To separate construction from representation"
                            is_correct: true
                          - choice_text: "To reduce memory usage"
                            is_correct: false
                          - choice_text: "To simplify inheritance"
                            is_correct: false
                statement_verification:
                  summary: Statement verification questions
                  value:
                    topic_title: "Design Patterns"
                    questions:
                      - question_text: "The Builder pattern is a creational design pattern."
                        question_type: "STATEMENT_VERIFICATION"
                        explanation: "True. The Builder pattern is classified as a creational design pattern."
                        difficulty_level: "MEDIUM"
                        choices:
                          - choice_text: "True"
                            is_correct: true
                          - choice_text: "False"
                            is_correct: false
                statement_counting:
                  summary: Statement counting questions
                  value:
                    topic_title: "Design Patterns"
                    questions:
                      - question_text: "How many key components does the Builder pattern typically have?"
                        question_type: "STATEMENT_COUNTING"
                        explanation: "The Builder pattern typically has 4 key components: Builder, Concrete Builder, Director, and Product."
                        difficulty_level: "MEDIUM"
                        choices:
                          - choice_text: "2"
                            is_correct: false
                          - choice_text: "3"
                            is_correct: false
                          - choice_text: "4"
                            is_correct: true
                          - choice_text: "5"
                            is_correct: false
        '400':
          description: Bad Request - Invalid quiz configuration or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_difficulty:
                  value:
                    timestamp: "2026-02-05T10:30:00Z"
                    status: 400
                    error: "Bad Request"
                    message: "Invalid difficulty level"
                    path: "/api/v1/generate-quiz"
                    details:
                      - "Difficulty must be one of: EASY, MEDIUM, HARD"
                invalid_question_type:
                  value:
                    timestamp: "2026-02-05T10:30:00Z"
                    status: 400
                    error: "Bad Request"
                    message: "Invalid question type"
                    path: "/api/v1/generate-quiz"
                    details:
                      - "Question type must be one of: NORMAL_MULTIPLE, STATEMENT_VERIFICATION, STATEMENT_COUNTING"
        '500':
          description: Internal Server Error - Quiz generation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                parsing_error:
                  value:
                    timestamp: "2026-02-05T10:30:00Z"
                    status: 500
                    error: "QuizParsingException"
                    message: "Failed to parse quiz response from AI"
                    path: "/api/v1/generate-quiz"
                    details: null
                generation_error:
                  value:
                    timestamp: "2026-02-05T10:30:00Z"
                    status: 500
                    error: "QuizGenerationException"
                    message: "Failed to generate quiz after 2 retries"
                    path: "/api/v1/generate-quiz"
                    details:
                      - "AI service timeout"
        '503':
          description: Service Unavailable - AI service is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: "2026-02-05T10:30:00Z"
                status: 503
                error: "Service Unavailable"
                message: "AI service is currently unavailable after 2 retries"
                path: "/api/v1/generate-quiz"
                details:
                  - "Connection refused"
components:
  schemas:
    Body_process_pdf_api_v1_process_pdf_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_process_pdf_api_v1_process_pdf_post
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the error occurred
          example: "2026-01-25T10:30:00Z"
        status:
          type: integer
          description: HTTP status code
          example: 400
        error:
          type: string
          description: HTTP status phrase or error type
          example: "Bad Request"
        message:
          type: string
          description: Human-readable error message
          example: "No filename provided"
        path:
          type: string
          description: Request path that caused the error
          example: "/api/v1/process-pdf"
        details:
          type: array
          description: Optional additional error details
          items:
            type: string
          example: ["Maximum size: 10.0MB", ".pdf"]
      required:
        - timestamp
        - status
        - error
        - message
        - path
    ProcessedTopic:
      properties:
        order_index:
          type: integer
          title: Order Index
        title:
          type: string
          title: Title
        description:
          type: string
          title: Description
        raw_text:
          type: string
          title: Raw Text
        summary_note:
          type: string
          title: Summary Note
      type: object
      required:
      - order_index
      - title
      - description
      - raw_text
      - summary_note
      title: ProcessedTopic
    GenerateQuizRequest:
      type: object
      properties:
        topicName:
          type: string
          minLength: 1
          description: Name of the topic to generate quiz for
        topicContent:
          type: string
          minLength: 1
          description: Content/text about the topic
        quiz_config:
          type: array
          items:
            $ref: '#/components/schemas/QuizConfig'
          description: Quiz configuration array
      required:
        - topicName
        - topicContent
        - quiz_config
      title: GenerateQuizRequest
    QuizConfig:
      type: object
      properties:
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
          description: Difficulty level for questions
        quiz_type_config:
          type: array
          items:
            $ref: '#/components/schemas/QuestionTypeRequest'
          description: Question type specifications
      required:
        - difficulty
        - quiz_type_config
      title: QuizConfig
    QuestionTypeRequest:
      type: object
      properties:
        type:
          type: string
          enum: [NORMAL_MULTIPLE, STATEMENT_VERIFICATION, STATEMENT_COUNTING]
          description: Type of question to generate
        number:
          type: integer
          minimum: 1
          description: Number of questions to generate
      required:
        - type
        - number
      title: QuestionTypeRequest
    QuizResponse:
      type: object
      properties:
        topic_title:
          type: string
          description: Title of the quiz topic
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionResponse'
          description: Generated questions
      required:
        - topic_title
        - questions
      title: QuizResponse
    QuestionResponse:
      type: object
      properties:
        question_text:
          type: string
          minLength: 1
          description: The question text
        question_type:
          type: string
          enum: [NORMAL_MULTIPLE, STATEMENT_VERIFICATION, STATEMENT_COUNTING]
          description: Type of question
        explanation:
          type: string
          minLength: 1
          description: Explanation of the answer
        difficulty_level:
          type: string
          enum: [EASY, MEDIUM, HARD]
          description: Difficulty level of the question
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceResponse'
          description: Available choices for the question
      required:
        - question_text
        - question_type
        - explanation
        - difficulty_level
        - choices
      title: QuestionResponse
    ChoiceResponse:
      type: object
      properties:
        choice_text:
          type: string
          minLength: 1
          description: The choice text
        is_correct:
          type: boolean
          description: Whether this choice is correct
      required:
        - choice_text
        - is_correct
      title: ChoiceResponse
